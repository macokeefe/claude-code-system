<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick-Lock Trellis — CAD Drawing</title>
<style>
  body{margin:0;background:#5a626b;font-family:"Arial Narrow",Arial,sans-serif}
  .sheet{max-width:1180px;margin:18px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  svg{display:block;width:100%;height:auto}
  @media print{body{background:#fff}.sheet{box-shadow:none;margin:0;max-width:none}}
</style>
</head>
<body>
<div class="sheet">
<svg viewBox="0 0 1180 820" font-family="Arial, 'Arial Narrow', sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 1 L9 4 L0 7 Z" fill="#111"/></marker>
    <marker id="ahs" markerWidth="12" markerHeight="12" refX="0" refY="4" orient="auto"><path d="M9 1 L0 4 L9 7 Z" fill="#111"/></marker>
    <marker id="ld" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><circle cx="4" cy="4" r="2.4" fill="#111"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#111" stroke-width="0.7"/>
    </pattern>
    <pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#111" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- sheet border -->
  <rect x="8" y="8" width="1164" height="804" fill="none" stroke="#111" stroke-width="2.5"/>
  <rect x="20" y="20" width="1140" height="780" fill="none" stroke="#111" stroke-width="1"/>

  <!-- ===================== TOP VIEW ===================== -->
  <text x="60" y="58" font-size="15" font-weight="bold" letter-spacing="1">TOP VIEW</text>
  <text x="150" y="58" font-size="11" fill="#444">trellis seat-support (slats + 2 rails)</text>

  <!-- two rails (flat bars), horizontal -->
  <rect x="80" y="120" width="430" height="16" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="80" y="300" width="430" height="16" fill="none" stroke="#111" stroke-width="1.4"/>
  <!-- keyhole slots in rails (one per slat station) -->
  <g stroke="#111" stroke-width="1" fill="none">
    <!-- x stations: 120,200,280,360,440 -->
    <g><circle cx="120" cy="128" r="5"/><rect x="117.5" y="128" width="5" height="9"/></g>
    <g><circle cx="200" cy="128" r="5"/><rect x="197.5" y="128" width="5" height="9"/></g>
    <g><circle cx="280" cy="128" r="5"/><rect x="277.5" y="128" width="5" height="9"/></g>
    <g><circle cx="360" cy="128" r="5"/><rect x="357.5" y="128" width="5" height="9"/></g>
    <g><circle cx="440" cy="128" r="5"/><rect x="437.5" y="128" width="5" height="9"/></g>
    <g><circle cx="120" cy="308" r="5"/><rect x="117.5" y="299" width="5" height="9"/></g>
    <g><circle cx="200" cy="308" r="5"/><rect x="197.5" y="299" width="5" height="9"/></g>
    <g><circle cx="280" cy="308" r="5"/><rect x="277.5" y="299" width="5" height="9"/></g>
    <g><circle cx="360" cy="308" r="5"/><rect x="357.5" y="299" width="5" height="9"/></g>
    <g><circle cx="440" cy="308" r="5"/><rect x="437.5" y="299" width="5" height="9"/></g>
  </g>
  <!-- slats (visible outline), vertical -->
  <g stroke="#111" stroke-width="1.2" fill="none">
    <rect x="113" y="110" width="14" height="216"/>
    <rect x="193" y="110" width="14" height="216"/>
    <rect x="273" y="110" width="14" height="216"/>
    <rect x="353" y="110" width="14" height="216"/>
    <rect x="433" y="110" width="14" height="216"/>
  </g>
  <!-- centre lines on slats -->
  <g stroke="#888" stroke-width="0.7" stroke-dasharray="10 3 2 3">
    <line x1="120" y1="98" x2="120" y2="338"/><line x1="200" y1="98" x2="200" y2="338"/>
    <line x1="280" y1="98" x2="280" y2="338"/><line x1="360" y1="98" x2="360" y2="338"/>
    <line x1="440" y1="98" x2="440" y2="338"/>
  </g>

  <!-- section cut line A-A -->
  <g stroke="#111" stroke-width="1.4">
    <line x1="250" y1="92" x2="250" y2="350" stroke-dasharray="14 4 3 4"/>
  </g>
  <text x="244" y="86" font-size="13" font-weight="bold">A</text>
  <text x="244" y="364" font-size="13" font-weight="bold">A</text>
  <path d="M250 92 l-9 9 M250 92 l9 9" stroke="#111" stroke-width="1.4" fill="none"/>

  <!-- DIMENSIONS top view -->
  <!-- pitch dim between slat 1 and 2 -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="120" y1="388" x2="200" y2="388" marker-start="url(#ahs)" marker-end="url(#ah)"/>
    <line x1="120" y1="338" x2="120" y2="396"/><line x1="200" y1="338" x2="200" y2="396"/>
  </g>
  <text x="160" y="384" font-size="11" text-anchor="middle">PITCH (REF)</text>
  <!-- overall length -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="80" y1="420" x2="510" y2="420" marker-start="url(#ahs)" marker-end="url(#ah)"/>
    <line x1="80" y1="338" x2="80" y2="428"/><line x1="510" y1="318" x2="510" y2="428"/>
  </g>
  <text x="295" y="416" font-size="11" text-anchor="middle">OVERALL LENGTH — PER SIZE / WORK ORDER</text>
  <!-- rail spacing vertical -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="56" y1="128" x2="56" y2="308" marker-start="url(#ahs)" marker-end="url(#ah)"/>
    <line x1="48" y1="128" x2="113" y2="128"/><line x1="48" y1="308" x2="113" y2="308"/>
  </g>
  <text x="50" y="222" font-size="11" text-anchor="middle" transform="rotate(-90 50 222)">RAIL SPACING (REF)</text>

  <!-- ===================== SECTION A-A ===================== -->
  <text x="60" y="500" font-size="15" font-weight="bold" letter-spacing="1">SECTION  A–A</text>
  <text x="220" y="500" font-size="11" fill="#444">slat stud engaged in keyhole rail + cam lock</text>

  <!-- rail in section (hatched), seen end-on -->
  <rect x="120" y="600" width="300" height="22" fill="url(#hatch)" stroke="#111" stroke-width="1.4"/>
  <text x="430" y="615" font-size="10" fill="#444">rail (section)</text>
  <!-- slat standing on rail -->
  <rect x="250" y="540" width="22" height="64" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="282" y="556" font-size="10" fill="#444">slat</text>
  <!-- stud through rail, head captured under rail -->
  <rect x="258" y="604" width="6" height="20" fill="#111"/>
  <rect x="252" y="622" width="18" height="6" fill="#111"/>
  <text x="300" y="640" font-size="10" fill="#444">stud head — captured under rail</text>
  <!-- cam lock body below -->
  <circle cx="180" cy="611" r="13" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="167" y="608" width="26" height="6" fill="#111"/>
  <path d="M180 624 L180 650" stroke="#111" stroke-width="0.7" marker-end="url(#ld)"/>
  <text x="186" y="662" font-size="10" fill="#444">1/4-turn cam — LOCKED (bar across = retained)</text>
  <!-- ground/seat line -->
  <line x1="90" y1="622" x2="470" y2="622" stroke="#888" stroke-width="0.6" stroke-dasharray="3 3"/>

  <!-- ===================== DETAIL A : keyhole ===================== -->
  <circle cx="820" cy="150" r="2" fill="#111"/>
  <text x="60" y="86" font-size="0"></text>
  <text x="720" y="58" font-size="15" font-weight="bold" letter-spacing="1">DETAIL  A</text>
  <text x="820" y="58" font-size="11" fill="#444">keyhole slot — SCALE 2:1</text>

  <!-- rail piece -->
  <rect x="700" y="110" width="320" height="150" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- keyhole: big circle + slot -->
  <g fill="none" stroke="#111" stroke-width="1.4">
    <circle cx="820" cy="160" r="26"/>
    <path d="M806 160 a14 14 0 0 1 28 0 L834 230 L806 230 Z"/>
  </g>
  <!-- centre lines -->
  <g stroke="#888" stroke-width="0.7" stroke-dasharray="10 3 2 3">
    <line x1="820" y1="96" x2="820" y2="250"/>
    <line x1="770" y1="160" x2="870" y2="160"/>
  </g>
  <!-- dims: hole dia -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="794" y1="160" x2="846" y2="160" marker-start="url(#ahs)" marker-end="url(#ah)"/>
  </g>
  <text x="820" y="152" font-size="11" text-anchor="middle">⌀ D — stud head + clearance</text>
  <!-- slot width -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="806" y1="244" x2="834" y2="244" marker-start="url(#ahs)" marker-end="url(#ah)"/>
    <line x1="806" y1="230" x2="806" y2="250"/><line x1="834" y1="230" x2="834" y2="250"/>
  </g>
  <text x="820" y="262" font-size="11" text-anchor="middle">W — stud shank ( &lt; D )</text>
  <!-- slot length / slide -->
  <g stroke="#111" stroke-width="0.7">
    <line x1="900" y1="160" x2="900" y2="230" marker-start="url(#ahs)" marker-end="url(#ah)"/>
    <line x1="846" y1="160" x2="906" y2="160"/><line x1="834" y1="230" x2="906" y2="230"/>
  </g>
  <text x="912" y="198" font-size="11">SLIDE — slat seats here</text>
  <text x="700" y="290" font-size="10.5" fill="#444">Stud drops through ⌀D, slat slides down the slot; shank (W) trapped, head retained behind rail.</text>

  <!-- ===================== DETAIL B : cam ===================== -->
  <text x="720" y="360" font-size="15" font-weight="bold" letter-spacing="1">DETAIL  B</text>
  <text x="830" y="360" font-size="11" fill="#444">1/4-turn cam — UNLOCK ↔ LOCK</text>
  <!-- unlocked -->
  <circle cx="790" cy="430" r="34" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="785" y="400" width="10" height="60" fill="#111"/>
  <text x="790" y="490" font-size="11" text-anchor="middle">UNLOCKED (slot ∥ rail)</text>
  <!-- rotation arrow -->
  <path d="M845 430 a22 22 0 0 1 0 0" fill="none"/>
  <path d="M838 410 a26 26 0 0 1 22 40" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="876" y="412" font-size="12" font-weight="bold">90°</text>
  <!-- locked -->
  <circle cx="960" cy="430" r="34" fill="none" stroke="#111" stroke-width="1.4"/>
  <rect x="930" y="425" width="60" height="10" fill="#111"/>
  <text x="960" y="490" font-size="11" text-anchor="middle">LOCKED (bar ⟂ — retains slat)</text>

  <!-- ===================== NOTES ===================== -->
  <text x="720" y="540" font-size="13" font-weight="bold">NOTES:</text>
  <text x="720" y="560" font-size="11">1. NO WELDED JOINTS. ALL SLATS INDIVIDUALLY REMOVABLE FOR SERVICE.</text>
  <text x="720" y="578" font-size="11">2. FASTENER: ONE (1) 1/4-TURN CAM PER SLAT END (2 PER SLAT) — REPLACES 4 SCREWS.</text>
  <text x="720" y="596" font-size="11">3. RAILS: EXISTING FLAT BAR + KEYHOLE SLOTS (PUNCHED / LASER).</text>
  <text x="720" y="614" font-size="11">4. SLAT STUDS: PRESS-IN SHOULDER STUD, BOTH ENDS.</text>
  <text x="720" y="632" font-size="11">5. DIMENSIONS D / W / SLIDE PER FINAL HARDWARE SELECTION.</text>
  <text x="720" y="650" font-size="11" font-weight="bold">6. CONCEPT — NOT TO SCALE. FOR REVIEW WITH ENGINEERING.</text>

  <!-- ===================== TITLE BLOCK ===================== -->
  <g stroke="#111" stroke-width="1.2" fill="none">
    <rect x="700" y="690" width="460" height="100"/>
    <line x1="700" y1="722" x2="1160" y2="722"/>
    <line x1="700" y1="752" x2="1160" y2="752"/>
    <line x1="940" y1="690" x2="940" y2="722"/>
    <line x1="900" y1="752" x2="900" y2="790"/>
    <line x1="1030" y1="752" x2="1030" y2="790"/>
  </g>
  <text x="712" y="711" font-size="15" font-weight="bold">QUICK-LOCK TRELLIS — SEAT SUPPORT</text>
  <text x="952" y="711" font-size="11">SOLA LOUNGE</text>
  <text x="712" y="742" font-size="10" fill="#444">SUBASSEMBLY: seat support frame (all 3 Sola configs)</text>
  <text x="712" y="770" font-size="9" fill="#444">DRAWN</text><text x="712" y="784" font-size="11">Process Eng.</text>
  <text x="910" y="770" font-size="9" fill="#444">SCALE</text><text x="910" y="784" font-size="11">NTS</text>
  <text x="1040" y="770" font-size="9" fill="#444">REV</text><text x="1040" y="784" font-size="11">A — concept</text>
  <text x="712" y="806" font-size="0"></text>

  <!-- impact tag (engineering note callout) -->
  <g>
    <rect x="60" y="700" width="600" height="90" fill="none" stroke="#111" stroke-width="1.2"/>
    <text x="74" y="722" font-size="13" font-weight="bold">PROJECTED IMPACT</text>
    <text x="74" y="744" font-size="12">SEAT SUPPORT: 32:30  →  ~10–12 MIN  (fastening reduced ~75%)</text>
    <text x="74" y="764" font-size="12">≈ 20 MIN SAVED / SOFA  ·  ~16% OF TOTAL SOLA LABOR  ·  ALL 3 CONFIGS</text>
    <text x="74" y="782" font-size="10.5" fill="#444">Basis: recorded Seat Support time (medium); assumes step is fastening-dominated.</text>
  </g>
</svg>
</div>
</body>
</html>
