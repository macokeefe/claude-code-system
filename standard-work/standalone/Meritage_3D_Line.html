<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meritage 3-Seater — 3D Line Model</title>
<style>
  :root{--navy:#15263a;--mut:#6b7785;--rust:#b3502e;--ship:#2f7d52}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Inter","Segoe UI",Arial,sans-serif;color:#1c2024;background:#e9edf1;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  header .sp{flex:1}
  .ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:#cdd6e0}
  .ctl input[type=number]{width:50px}
  .ctl input[type=range]{width:90px}
  button{background:#22364f;color:#fff;border:1px solid #34506f;border-radius:7px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
  button:hover{background:#2c465f}
  button.go{background:var(--ship);border-color:var(--ship)}
  input,select{font-family:inherit;border:1px solid #9fb0c2;border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:#1c2024}
  #stage{position:relative;flex:1;min-height:0}
  #view{position:absolute;inset:0}
  #view canvas{display:block;width:100%;height:100%}
  .readouts{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;z-index:4}
  .rd{background:rgba(255,255,255,.93);border:1px solid #dfe3e8;border-radius:10px;padding:6px 12px;min-width:96px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .rd .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .rd .v{font-size:18px;font-weight:800;color:var(--navy)}
  .rd .v small{font-size:11px;font-weight:600;color:var(--mut)}
  #times{position:absolute;top:12px;right:12px;width:212px;background:rgba(255,255,255,.95);border:1px solid #dfe3e8;border-radius:12px;padding:10px 12px;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #times h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .trow{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
  .trow .tn{flex:1;font-weight:700;color:var(--navy);font-size:11px}
  .trow .tp{font-size:10px;color:var(--mut);width:34px;text-align:right}
  .trow input{width:54px;text-align:center}
  .trow .tu{font-size:10px;color:var(--mut);width:30px}
  .hint{position:absolute;bottom:10px;left:12px;font-size:11.5px;color:#4a5562;background:rgba(255,255,255,.8);padding:5px 10px;border-radius:8px;z-index:4}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MERITAGE 3-SEATER — 3D LINE MODEL</h1>
    <div class="ctl">Chairs <input type="number" id="n" min="1" max="40" value="8"/></div>
    <div class="ctl">Speed <input type="range" id="speed" min="2" max="60" value="14"/></div>
    <button class="go" id="play">▶ Play</button>
    <button id="reset">↺ Reset</button>
    <div class="sp"></div>
    <button id="cam">Angle view</button>
    <button id="top">Top view</button>
  </header>
  <div id="stage">
    <div id="view"></div>
    <div class="readouts">
      <div class="rd"><div class="k">Clock</div><div class="v" id="clock">0 min</div></div>
      <div class="rd"><div class="k">Shipped</div><div class="v"><span id="ship">0</span><small> / <span id="nOut">8</span></small></div></div>
      <div class="rd"><div class="k">Cycle</div><div class="v"><span id="cyc">47</span><small> min</small></div></div>
      <div class="rd"><div class="k">Capacity</div><div class="v"><span id="cap">8.9</span><small> /day</small></div></div>
      <div class="rd"><div class="k">Bottleneck</div><div class="v" style="font-size:13px;line-height:2.1" id="bot">Seat frame (47)</div></div>
    </div>
    <div id="times"><h3>Station times — editable</h3></div>
    <div class="hint">Drag to orbit · scroll to zoom · edit any time on the right and the line re-paces live</div>
  </div>
</div>
