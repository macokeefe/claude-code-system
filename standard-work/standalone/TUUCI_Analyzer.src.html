<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TUUCI · Standard Work Analyzer</title>
<style>
  :root{
    /* TUUCI identity — monochrome luxury (black wordmark + canopy arc) with
       a single antique-gold accent and a warm rust for the bottleneck/alert */
    --navy:#15171a; --navy-700:#26292e; --navy-900:#0c0d0f;   /* charcoal/black */
    --aqua:#a8854c; --aqua-dark:#8a6b39;                       /* antique gold accent */
    --bronze:#b1542f; --ink:#16181b; --muted:#6b7178;         /* rust = alert */
    --line:#e6e4df; --bg:#f1efe9; --card:#ffffff;             /* warm paper neutrals */
    --good:#4f7a5b; --warn:#b1542f;
    --shadow:0 1px 2px rgba(20,20,20,.06), 0 6px 24px rgba(20,20,20,.07);
    --radius:13px;
    --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --serif:"Times New Roman",Times,Georgia,"Hoefler Text",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
  button,input,select{font-family:inherit}
  a{color:var(--aqua-dark)}

  header.app{background:#fff;color:var(--ink);padding:18px 28px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:20px}
  .logo{display:flex;flex-direction:column;align-items:center;gap:1px}
  .logo .wordmark{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:.34em;padding-left:.34em;color:#111;line-height:1}
  .logo .arc{width:150px;height:18px;margin-top:1px;color:#111}
  .brand .rule{width:1px;height:34px;background:var(--line)}
  .brand .sub{display:flex;flex-direction:column;line-height:1.3}
  .brand .sub .t1{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
  .brand .sub .t2{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--aqua-dark)}

  /* tabs */
  nav.tabs{background:var(--navy-900);display:flex;gap:2px;padding:0 22px}
  nav.tabs button{background:transparent;border:0;color:rgba(255,255,255,.6);font-size:13.5px;font-weight:600;letter-spacing:.03em;padding:14px 20px;cursor:pointer;border-bottom:3px solid transparent;transition:.15s}
  nav.tabs button:hover{color:#fff}
  nav.tabs button.active{color:#fff;border-bottom-color:var(--aqua)}

  main{max-width:1200px;margin:0 auto;padding:30px 28px 90px}

  .btn{border:0;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.01em;transition:.15s}
  .btn-primary{background:var(--aqua);color:#fff}
  .btn-primary:hover{background:var(--aqua-dark)}
  .btn-light{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn-light:hover{border-color:var(--aqua);color:var(--aqua-dark)}
  .btn-danger{background:#fff;color:#b3392c;border:1px solid #f0cfca}
  .btn-danger:hover{background:#fdf2f1}
  .btn-sm{padding:6px 12px;font-size:13px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .ch{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .card .ch h2{margin:0;font-size:16px;font-weight:700;color:var(--navy)}
  .card .ch .hint{font-size:12px;color:var(--muted)}
  .card .cb{padding:22px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua-dark);margin:0 0 14px}
  .page-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:14px}
  .page-h h1{font-size:23px;font-weight:800;color:var(--navy);margin:0;letter-spacing:-.01em}
  .page-h .sub{font-size:13px;color:var(--muted);margin-top:3px}

  .hide{display:none!important}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px}

  /* sku cards */
  .sku-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .sku-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:.15s;border-top:3px solid var(--aqua)}
  .sku-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,38,58,.12)}
  .sku-card .nm{font-size:16px;font-weight:700;color:var(--navy)}
  .sku-card .meta{font-size:12.5px;color:var(--muted)}
  .sku-card .stat{display:flex;gap:18px;margin-top:4px}
  .sku-card .stat .v{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .sku-card .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .sku-card .row{display:flex;gap:8px;margin-top:6px}
  .add-card{display:flex;align-items:center;justify-content:center;border:2px dashed #c3d2d8;border-radius:var(--radius);background:#fafdfe;cursor:pointer;min-height:150px;color:var(--aqua-dark);font-weight:700;font-size:15px;transition:.15s}
  .add-card:hover{border-color:var(--aqua);background:#f3fbfc}
  .add-card .plus{font-size:30px;display:block;margin-bottom:4px;font-weight:400}

  /* dropzone */
  .dropzone{background:var(--card);border:2px dashed #c3d2d8;border-radius:18px;padding:46px 32px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);text-align:center}
  .dropzone:hover,.dropzone.drag{border-color:var(--aqua);background:#fafdfe}
  .dropzone .ic{width:50px;height:50px;margin:0 auto 16px;color:var(--aqua)}
  .dropzone .dz-t{font-size:17px;font-weight:700;color:var(--navy)}
  .dropzone .dz-s{font-size:13px;color:var(--muted);margin-top:6px}

  /* selects / fields */
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .fld select,.fld input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
  .fld select:focus,.fld input:focus{outline:0;border-color:var(--aqua);box-shadow:0 0 0 3px rgba(10,166,184,.15)}
  .map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .selrow{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
  .selrow .fld{min-width:220px}

  table.t{width:100%;border-collapse:collapse;font-size:13.5px}
  table.t th{text-align:left;padding:10px 12px;background:#f6f9fa;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  table.t td{padding:9px 12px;border-bottom:1px solid #f0f4f5;vertical-align:middle}
  table.t tr:hover td{background:#fafdfe}
  table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
  .stepname{font-weight:600;color:var(--ink);max-width:360px}
  .preview-wrap{overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:10px}
  .pv-note{font-size:12.5px;color:var(--muted);margin-top:12px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:27px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .val .u{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
  .kpi .sub2{font-size:12px;color:var(--muted);margin-top:4px}
  .kpi.accent{border-top:3px solid var(--aqua)}
  .kpi.bottleneck{border-top:3px solid var(--bronze)}
  .kpi.saved{border-top:3px solid var(--good)}
  .kpi .delta{font-size:12.5px;font-weight:700;color:var(--good);margin-top:4px}

  .bn-banner{display:flex;align-items:center;gap:16px;background:linear-gradient(90deg,#fff7ec,#fffdf9);border:1px solid #f0dcbd;border-left:4px solid var(--bronze);border-radius:12px;padding:16px 20px;margin-bottom:22px}
  .bn-banner .bdot{width:42px;height:42px;border-radius:10px;background:var(--bronze);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bn-banner .bt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bronze)}
  .bn-banner .bd{font-size:15px;color:var(--ink);margin-top:2px}
  .bn-banner .bd strong{color:var(--navy)}

  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
  @media(max-width:980px){.chart-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.map-grid{grid-template-columns:repeat(2,1fr)}}
  .chart-host svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* toggles */
  .chk{display:inline-flex;align-items:center;cursor:pointer}
  .chk input{position:absolute;opacity:0}
  .chk .sw{width:38px;height:22px;border-radius:12px;background:#cdd9de;position:relative;transition:.18s}
  .chk .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .chk input:checked + .sw{background:var(--aqua)}
  .chk input:checked + .sw::after{transform:translateX(16px)}
  .num-in{width:64px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;text-align:center}
  .num-in:focus{outline:0;border-color:var(--aqua)}
  .badge-bn{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--bronze);border-radius:5px;padding:2px 7px;margin-left:8px}
  .badge-help{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--aqua-dark);background:#e2f6f8;border-radius:5px;padding:2px 7px;margin-left:8px}

  /* compare */
  .cmp-grid{display:grid;grid-template-columns:1fr 70px 1fr;gap:0;align-items:stretch}
  .cmp-col h3{font-size:14px;font-weight:700;color:var(--navy);margin:0 0 10px;text-align:center}
  .cmp-list{display:flex;flex-direction:column;gap:6px;min-height:40px}
  .cmp-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--aqua);border-radius:8px;padding:9px 12px;cursor:grab;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;transition:.1s}
  .cmp-item:hover{border-color:var(--aqua);box-shadow:var(--shadow)}
  .cmp-item.dragging{opacity:.4}
  .cmp-item.over{border-top:2px solid var(--aqua)}
  .cmp-item .nm{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp-item .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);flex-shrink:0}
  .cmp-mid{display:flex;flex-direction:column;gap:6px;align-items:center}
  .cmp-delta{height:39px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;width:100%}
  .cmp-delta.up{color:#b3392c;background:#fdeceb}
  .cmp-delta.down{color:var(--good);background:#eaf7f1}
  .cmp-delta.zero{color:var(--muted)}

  /* line balance — operator columns */
  .bal-cols{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .bal-col{flex:1;min-width:150px;background:#faf9f6;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
  .bal-col.over{border-color:var(--bronze);box-shadow:0 0 0 2px rgba(177,84,47,.15)}
  .bal-col.drag{border-color:var(--aqua);background:#fbfaf5}
  .bal-col .bch{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .bal-col .bch .nm{font-size:12.5px;font-weight:700;color:var(--navy)}
  .bal-col .bch .tot{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .bal-col .bch .tot.over{color:var(--bronze)}
  .bal-col .bch .tot.ok{color:var(--good)}
  .bal-col .body{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:46px;flex:1}
  .bal-chip{background:#fff;border:1px solid var(--line);border-left:3px solid var(--aqua);border-radius:7px;padding:6px 7px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center;user-select:none}
  .bal-chip:hover{border-color:var(--aqua);box-shadow:var(--shadow)}
  .bal-chip.dragging{opacity:.4}
  .bal-chip .lft{display:flex;align-items:center;gap:6px;overflow:hidden}
  .bal-chip .drag-h{flex-shrink:0;color:#b3bcc1;font-size:14px;cursor:grab;touch-action:none;letter-spacing:-1px}
  .bal-chip .pnum{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:#15171a;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .bal-chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink)}
  .bal-chip .rgt{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .bal-chip .ct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);margin-right:2px}
  .bal-chip button{border:1px solid var(--line);background:#fff;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1;color:var(--muted);padding:0;display:flex;align-items:center;justify-content:center}
  .bal-chip button:hover{border-color:var(--aqua);color:var(--aqua-dark);background:#f5fcfd}
  .bal-chip button:disabled{opacity:.3;cursor:default}
  .bal-chip .cutbtn:hover{border-color:var(--bronze);color:var(--bronze);background:#fdf4ef}
  .bal-chip.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.22)}
  .prow{padding:6px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .prow .plab{font-size:11px;color:var(--muted)}
  .prow .pdiv{font-size:11px;color:var(--aqua-dark)}
  .bal-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;gap:14px;flex-wrap:wrap}
  .bal-hint b{color:var(--ink)}
  .cutrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:6px;margin-top:2px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}
  .cutrow input{width:62px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;text-align:center}
  .cutrow input:focus{outline:0;border-color:var(--aqua)}
  .cutrow .cl{white-space:nowrap}
  .bal-empty{color:#aeb8bd;font-size:11.5px;text-align:center;padding:10px 4px}

  /* layout / floor-plan */
  .lay-wrap{position:relative;width:100%;height:580px;border:1px solid var(--line);border-radius:12px;background:#fbfaf7;overflow:auto;background-image:radial-gradient(#dfe3df 1px,transparent 1px);background-size:22px 22px}
  .lay-canvas{position:relative;width:1500px;height:1000px}
  .lay-svg{position:absolute;left:0;top:0;width:1500px;height:1000px;pointer-events:none;overflow:visible}
  .lay-node{position:absolute;width:170px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .lay-node .nh{padding:7px 10px;cursor:grab;display:flex;justify-content:space-between;align-items:center;color:#fff;background:var(--navy);touch-action:none;user-select:none}
  .lay-node.src .nh{background:var(--aqua-dark)} .lay-node.sink .nh{background:var(--good)}
  .lay-node .nh .t{font-size:13px;font-weight:700} .lay-node .nh .p{font-size:11px;opacity:.9}
  .lay-node .nb{padding:8px 10px;font-size:11.5px;color:var(--ink);min-height:22px}
  .lay-node .nb .lab{font-weight:600;color:var(--navy)}
  .lay-node .nb .stp{color:var(--muted);font-size:11px;margin-top:2px}
  .lay-node .nf{padding:5px 10px 8px;display:flex;align-items:center;gap:5px;border-top:1px solid #f0f0ec}
  .lay-node .nf label{font-size:10px;color:var(--muted)} .lay-node .nf input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11px}
  .lay-node .nf input:focus{outline:0;border-color:var(--aqua)}
  .lay-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .lay-hint b{color:var(--ink)}

  /* operator bars */
  .opbar-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .opbar-row .lab{width:96px;font-size:12.5px;font-weight:600;color:var(--ink);flex-shrink:0}
  .opbar{flex:1;height:24px;border-radius:6px;background:#f0f4f5;display:flex;overflow:hidden;border:1px solid #e7eef0}
  .opbar .seg{height:100%}
  .opbar .seg.work{background:var(--aqua)}
  .opbar .seg.move{background:var(--bronze)}
  .opbar-row .pct{width:96px;font-size:11.5px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

  .footer{text-align:center;font-size:11px;color:#94a8b1;letter-spacing:.04em;margin-top:40px}
  .err{background:#fdeceb;border:1px solid #f5c6c2;color:#a3271d;border-radius:10px;padding:12px 16px;font-size:13.5px;margin:14px 0}
  .info{background:#eef7f9;border:1px solid #bfe3e8;color:#0a6470;border-radius:10px;padding:11px 15px;font-size:13px;margin:0 0 16px}
</style>
<script>/*__EXCELJS_LIB__*/</script>
</head>
<body>

<header class="app">
  <div class="brand">
    <div class="logo">
      <div class="wordmark">TUUCI</div>
      <svg class="arc" viewBox="0 0 160 20" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path d="M5 5 C 45 22, 115 22, 155 5 C 116 15, 44 15, 5 5 Z" fill="currentColor"/>
      </svg>
    </div>
    <div class="rule"></div>
    <div class="sub"><span class="t1">Standard Work Analyzer</span><span class="t2">The Art of Shade</span></div>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="skus" class="active">Products</button>
  <button data-tab="analysis">Analysis</button>
  <button data-tab="compare">Compare</button>
  <button data-tab="balance">Line Balance</button>
  <button data-tab="layout">Layout</button>
  <button data-tab="sim">Line Simulation</button>
</nav>

<main>
  <section id="tab-skus"></section>
  <section id="tab-analysis" class="hide"></section>
  <section id="tab-compare" class="hide"></section>
  <section id="tab-balance" class="hide"></section>
  <section id="tab-layout" class="hide"></section>
  <section id="tab-sim" class="hide"></section>
</main>

<input type="file" id="fileInput" accept=".xlsx,.xlsm" class="hide" />
<input type="file" id="backupInput" accept=".json,application/json" class="hide" />

<script>
"use strict";
/* ============================================================
   TUUCI Standard Work Analyzer — 4-tab build (vanilla JS)
   Products · Analysis · Compare · Line Simulation
   ============================================================ */

/* ---------- persistence ---------- */
var LS_KEY='tuuci_skus_v2';
function loadSkus(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){ return []; } }
function saveSkus(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S.skus)); }catch(e){} }
var LS_BAL='tuuci_bal_v1';
function loadBal(){ try{ return JSON.parse(localStorage.getItem(LS_BAL))||{}; }catch(e){ return {}; } }
function saveBal(){ try{ localStorage.setItem(LS_BAL, JSON.stringify(S.bal)); }catch(e){} }
var LS_LAYOUT='tuuci_layout_v1';
function loadLayout(){ try{ return JSON.parse(localStorage.getItem(LS_LAYOUT))||{}; }catch(e){ return {}; } }
function saveLayout(){ try{ localStorage.setItem(LS_LAYOUT, JSON.stringify(S.layout)); }catch(e){} }

var S = {
  skus: loadSkus(),
  tab: 'skus',
  add: null,                 // {sheets, map, fileName} during import
  edit: null,                // sku id being edited
  anaId: null,
  cmpA: null, cmpB: null, cmpOrderA: null, cmpOrderB: null,
  simId: null,
  sim: { units:3, ops:3, mode:'help', buffer:0.5 },
  bal: loadBal(),          // { skuId: {demand, hours, ops, assign:[opIndex per step]} }
  balId: null,
  layout: loadLayout(),    // { skuId: {pos:{id:{x,y}}, conn:{id:[ids]}} }
  layId: null, layDrag: null
};

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag,attrs,html){ var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==='class')e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!=null)e.innerHTML=html; return e; }
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function colLetter(n){ var s='';n++; while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);} return s; }
function fmt(n,d){ d=(d==null?1:d); if(n==null||isNaN(n))return '–'; var r=Number(n).toFixed(d); return r.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1'); }
function fmtMin(n){ return fmt(n,1); }
function clampStr(s,n){ s=String(s==null?'':s); return s.length>n?s.slice(0,n-1)+'…':s; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function skuById(id){ for(var i=0;i<S.skus.length;i++) if(S.skus[i].id===id) return S.skus[i]; return null; }
function skuTotal(sku){ return sku.steps.reduce(function(a,s){return a+s.time;},0); }
/* effective (split) time of a step using its max operators */
function stepBest(s){ return (s.helpable && s.maxOps>1) ? s.time/s.maxOps : s.time; }
function skuBestTotal(sku){ return sku.steps.reduce(function(a,s){return a+stepBest(s);},0); }

/* ---------- Excel value normalization ---------- */
function cellVal(v){ if(v==null)return null; if(typeof v==='object'){ if(v.result!=null)return v.result; if(v.text!=null)return v.text; if(Array.isArray(v.richText))return v.richText.map(function(r){return r.text;}).join(''); if(v instanceof Date)return v; return null; } return v; }
function asNum(v){ v=cellVal(v); if(v==null)return null; if(typeof v==='number')return isFinite(v)?v:null; var s=String(v).replace(/[^0-9.\-:]/g,''); if(s.indexOf(':')>=0){var p=s.split(':').map(Number); if(p.some(isNaN))return null; return p.length===3?p[0]*60+p[1]+p[2]/60:p[0]+p[1]/60;} var n=parseFloat(s); return isNaN(n)?null:n; }
function asText(v){ v=cellVal(v); if(v==null)return''; if(v instanceof Date)return''; return String(v).trim(); }

/* ============================================================
   IMPORT / PARSE  (used by Products → Add)
   ============================================================ */
function handleFile(file){
  if(!file) return;
  if(!/\.(xlsx|xlsm)$/i.test(file.name)){ alert('Please choose an Excel .xlsx or .xlsm file.'); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var wb=new ExcelJS.Workbook();
    wb.xlsx.load(reader.result).then(function(){
      var sheets=[];
      wb.eachSheet(function(ws){
        var maxR=Math.min(ws.rowCount||0,400), maxC=Math.min(ws.columnCount||0,40), grid=[];
        for(var r=1;r<=maxR;r++){ var row=[],rr=ws.getRow(r); for(var c=1;c<=maxC;c++) row.push(rr.getCell(c).value); grid.push(row); }
        sheets.push({name:ws.name,grid:grid});
      });
      if(!sheets.length){ alert('No worksheets found.'); return; }
      var map=autoDetect(sheets);
      S.add={ sheets:sheets, map:map, fileName:file.name };
      renderImport();
    }).catch(function(e){ console.error(e); alert('Could not read that file. Is it a valid Excel workbook?'); });
  };
  reader.readAsArrayBuffer(file);
}
function autoDetect(sheets){
  var best=null;
  var TIME_RE=/\b(time|min|minute|sec|second|duration|cycle)\b/i;
  var NAME_RE=/\b(step|task|operation|element|description|process|activity|work)\b/i;
  for(var si=0;si<sheets.length;si++){ var grid=sheets[si].grid;
    for(var hr=0;hr<Math.min(grid.length,20);hr++){ var row=grid[hr]||[],tc=-1,nc=-1;
      for(var c=0;c<row.length;c++){ var t=asText(row[c]); if(!t)continue; if(tc<0&&TIME_RE.test(t))tc=c; if(nc<0&&NAME_RE.test(t))nc=c; }
      if(tc>=0){ var score=(nc>=0?2:0)+1+countNum(grid,hr,tc); if(!best||score>best.score) best={score:score,sheet:si,headerRow:hr,timeCol:tc,nameCol:chooseNameCol(grid,hr,tc,nc)}; }
    }
  }
  if(!best){ var g0=sheets[0].grid, tc=mostNumericCol(g0); best={sheet:0,headerRow:findHeaderGuess(g0,tc),timeCol:tc,nameCol:guessNameCol(g0,0,tc)}; }
  var htxt=asText((sheets[best.sheet].grid[best.headerRow]||[])[best.timeCol]);
  best.unit = /\bsec/i.test(htxt)?'sec':'min';
  best.numCol = detectNumCol(sheets[best.sheet].grid, best.headerRow, best.timeCol, best.nameCol);
  return best;
}
/* find the column holding step numbers: mostly integers, mostly increasing */
function detectNumCol(grid,headerRow,timeCol,nameCol){
  var w=0; grid.forEach(function(r){ if(r&&r.length>w)w=r.length; });
  var best=-1,bestScore=0;
  for(var c=0;c<w;c++){ if(c===timeCol||c===nameCol)continue;
    var prev=null,inc=0,ints=0,total=0;
    for(var r=headerRow+1;r<grid.length;r++){ var v=asNum((grid[r]||[])[c]); if(v==null)continue; total++;
      if(Math.abs(v-Math.round(v))<1e-9){ ints++; if(prev==null||v>prev)inc++; prev=v; } }
    if(total>=3 && ints>=total*0.6){ var score=ints+inc; if(score>bestScore){ bestScore=score; best=c; } }
  }
  return best;
}
function countNum(grid,hr,c){ var n=0; for(var r=hr+1;r<grid.length;r++){ if(asNum((grid[r]||[])[c])>0)n++; } return n; }
function mostNumericCol(grid){ var w=(grid[0]||[]).length,best=0,bc=1; for(var c=0;c<w;c++){var n=0;for(var r=0;r<grid.length;r++){if(asNum((grid[r]||[])[c])>0)n++;}if(n>best){best=n;bc=c;}} return bc; }
function colTextLen(grid,hr,c){ var len=0; for(var r=hr+1;r<grid.length;r++){var t=asText((grid[r]||[])[c]); if(t&&asNum(t)==null)len+=t.length;} return len; }
function guessNameCol(grid,hr,skip){ var w=(grid[hr]||[]).length,best=0,bc=0; for(var c=0;c<w;c++){if(c===skip)continue;var l=colTextLen(grid,hr,c);if(l>best){best=l;bc=c;}} return bc; }
function chooseNameCol(grid,hr,timeCol,regexCol){ var ti=guessNameCol(grid,hr,timeCol); if(regexCol>=0&&regexCol!==timeCol){ if(colTextLen(grid,hr,regexCol)>=0.5*colTextLen(grid,hr,ti))return regexCol; } return ti; }
function findHeaderGuess(grid,tc){ for(var r=0;r<Math.min(grid.length,20);r++){ if(asText((grid[r]||[])[tc]))return r; } return 0; }
function extractSteps(sheets,map){
  var grid=sheets[map.sheet].grid, out=[];
  for(var r=map.headerRow+1;r<grid.length;r++){ var row=grid[r]||[]; var t=asNum(row[map.timeCol]); if(t==null||t<=0)continue;
    var name=asText(row[map.nameCol]); if(/^(total|grand total|sum|process total)\b/i.test(name))continue; if(!name)name='Step '+(out.length+1);
    var num=null; if(map.numCol!=null && map.numCol>=0){ var nv=asNum(row[map.numCol]); if(nv!=null && Math.abs(nv-Math.round(nv))<1e-9) num=Math.round(nv); }
    out.push({ name:name, time:(map.unit==='sec'?t/60:t), num:num });
  }
  return out;
}

/* ============================================================
   ANALYSIS MODEL
   ============================================================ */
function analyze(sku){
  var steps=sku.steps, total=0, best=0, bnIdx=-1, bnVal=-1;
  steps.forEach(function(s,i){ total+=s.time; var b=stepBest(s); best+=b; if(s.time>bnVal){bnVal=s.time;bnIdx=i;} });
  return {total:total, best:best, saved:total-best, bnIdx:bnIdx, bnVal:bnVal, count:steps.length};
}

/* ============================================================
   LINE SIMULATION
   ============================================================ */
/* contiguous partition of step weights into <=K parts, minimizing max part sum */
function partition(weights, K){
  K=Math.min(K, weights.length); if(K<1)K=1;
  var lo=Math.max.apply(null,weights), hi=weights.reduce(function(a,b){return a+b;},0);
  function feasible(cap){ var parts=1,cur=0; for(var i=0;i<weights.length;i++){ if(cur+weights[i]>cap){parts++;cur=weights[i]; if(parts>K)return false;} else cur+=weights[i]; } return true; }
  while(lo<hi){ var mid=Math.floor((lo+hi)/2); if(feasible(mid))hi=mid; else lo=mid+1; }
  var cap=lo, groups=[], cur=[], sum=0;
  for(var i=0;i<weights.length;i++){ if(sum+weights[i]>cap&&cur.length){groups.push(cur);cur=[];sum=0;} cur.push(i); sum+=weights[i]; }
  if(cur.length)groups.push(cur);
  return groups;
}
/* MODE A — operators pinned to stations; units pipeline through */
function simStations(steps, K, Q, buffer){
  var w=steps.map(function(s){return s.time;});
  var groups=partition(w,K);
  var stations=groups.map(function(g){
    var work=g.reduce(function(a,i){return a+steps[i].time;},0);
    return { steps:g, work:work, eff:work+buffer }; // buffer = per-unit material handling
  });
  var sumEff=stations.reduce(function(a,s){return a+s.eff;},0);
  var cycle=Math.max.apply(null, stations.map(function(s){return s.eff;}));
  var makespan=sumEff + (Q-1)*cycle;
  var ops=[];
  stations.forEach(function(st,k){
    var busy=st.eff*Q, move=buffer*Q, work=st.work*Q;
    ops.push({ name:'Op '+(k+1), work:work, move:move, busy:busy, idle:Math.max(0,makespan-busy), role:'Station '+(k+1)+' ('+st.steps.length+' step'+(st.steps.length>1?'s':'')+')' });
  });
  for(var x=stations.length;x<K;x++) ops.push({ name:'Op '+(x+1), work:0, move:0, busy:0, idle:makespan, role:'Unassigned (spare)' });
  return finishSim(makespan, ops, K, Q, cycle, stations.length);
}
/* MODE B — operators float and help on helpable steps (crew up to maxOps) */
function simHelping(steps, K, Q, buffer){
  var n=steps.length;
  var units=[]; for(var u=0;u<Q;u++) units.push({step:0, done:false, active:false});
  var ops=[]; for(var i=0;i<K;i++) ops.push({name:'Op '+(i+1), busy:0, move:0, work:0, freeAt:0});
  var active=[]; var t=0; var guard=0, maxGuard=Q*n*6+2000;
  var capOf=function(i){ return (steps[i].helpable? Math.max(1,steps[i].maxOps||1):1); };
  while(guard++<maxGuard){
    var idle=ops.filter(function(o){return o.freeAt<=t+1e-9;});
    var avail=units.filter(function(u){return !u.done && !u.active;});
    if(idle.length && avail.length){
      avail.sort(function(a,b){return steps[b.step].time-steps[a.step].time;});
      var started=[];
      for(var a1=0;a1<avail.length && idle.length;a1++){ var u=avail[a1]; var op=idle.shift(); var task={u:u, idx:u.step, crew:[op]}; u.active=true; started.push(task); }
      started.sort(function(a,b){return steps[b.idx].time-steps[a.idx].time;});
      var added=true;
      while(idle.length && added){ added=false;
        for(var s2=0;s2<started.length;s2++){ var tk=started[s2]; if(tk.crew.length<capOf(tk.idx) && idle.length){ tk.crew.push(idle.shift()); added=true; } }
      }
      started.forEach(function(tk){
        var base=steps[tk.idx].time, crew=tk.crew.length;
        var workT=(steps[tk.idx].helpable? base/crew : base);
        var dur=workT+buffer; var end=t+dur;
        active.push({u:tk.u, end:end});
        tk.crew.forEach(function(o){ o.freeAt=end; o.busy+=dur; o.work+=workT; o.move+=buffer; });
      });
    }
    if(!active.length){
      if(units.every(function(u){return u.done;})) break;
      var nf=Math.min.apply(null, ops.map(function(o){return o.freeAt;}).filter(function(x){return x>t;}));
      if(!isFinite(nf)) break; t=nf; continue;
    }
    var nextEnd=Math.min.apply(null, active.map(function(a){return a.end;}));
    t=nextEnd;
    var done=active.filter(function(a){return a.end<=t+1e-9;});
    active=active.filter(function(a){return a.end>t+1e-9;});
    done.forEach(function(a){ a.u.active=false; a.u.step++; if(a.u.step>=n)a.u.done=true; });
    if(units.every(function(u){return u.done;}) && !active.length) break;
  }
  var makespan=t;
  ops.forEach(function(o){ o.idle=Math.max(0,makespan-o.busy); o.role='Floating'; });
  return finishSim(makespan, ops, K, Q, null, K);
}
function finishSim(makespan, ops, K, Q, cycle, used){
  var busyTotal=ops.reduce(function(a,o){return a+o.busy;},0);
  var moveTotal=ops.reduce(function(a,o){return a+o.move;},0);
  var idleTotal=ops.reduce(function(a,o){return a+o.idle;},0);
  return { makespan:makespan, ops:ops, util:(K*makespan>0?busyTotal/(K*makespan):0),
           idleTotal:idleTotal, moveTotal:moveTotal, cycle:cycle, used:used,
           throughput: makespan>0? Q*60/makespan : 0 };
}

/* ============================================================
   SVG CHARTS
   ============================================================ */
function paretoSVG(steps, bnIdx){
  var data=steps.map(function(s,i){return {name:s.name,time:s.time,i:i};}).sort(function(a,b){return b.time-a.time;});
  var n=data.length; if(!n) return '';
  var W=560,H=300,padL=42,padR=46,padT=18,padB=64, plotW=W-padL-padR, plotH=H-padT-padB;
  var maxT=data[0].time||1, total=data.reduce(function(a,d){return a+d.time;},0)||1, bw=plotW/n, gap=Math.min(8,bw*0.25);
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  for(var g=0;g<=4;g++){ var yy=padT+plotH*(1-g/4); svg+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#eef3f4"/><text x="'+(padL-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" fill="#8aa0a9">'+fmt(maxT*g/4,0)+'</text>'; }
  var cum=0,pts=[];
  for(var i=0;i<n;i++){ var d=data[i],x=padL+i*bw,bx=x+gap/2,bwid=bw-gap,bh=(d.time/maxT)*plotH,by=padT+plotH-bh,isBn=(d.i===bnIdx);
    svg+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(isBn?'#b1542f':'#15171a')+'"><title>'+esc(d.name)+' — '+fmtMin(d.time)+' min</title></rect>';
    cum+=d.time; pts.push([x+bw/2, padT+plotH*(1-cum/total)]);
    if(i<14) svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-padB+14)+'" text-anchor="end" font-size="8.5" fill="#8a8377" transform="rotate(-40 '+(x+bw/2).toFixed(1)+' '+(H-padB+14)+')">'+esc(clampStr(d.name,16))+'</text>';
  }
  var y80=padT+plotH*(1-0.8); svg+='<line x1="'+padL+'" y1="'+y80+'" x2="'+(W-padR)+'" y2="'+y80+'" stroke="#d8c39a" stroke-dasharray="4 4"/><text x="'+(W-padR+3)+'" y="'+(y80+3)+'" font-size="8.5" fill="#a8854c">80%</text>';
  svg+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="#a8854c" stroke-width="2"/>';
  pts.forEach(function(p){ svg+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="#a8854c"/>'; });
  for(var g2=0;g2<=4;g2++){ var yy2=padT+plotH*(1-g2/4); svg+='<text x="'+(W-padR+6)+'" y="'+(yy2+3)+'" font-size="9" fill="#8aa0a9">'+(g2*25)+'%</text>'; }
  return svg+'</svg>';
}
function stepBarSVG(steps, bnIdx){
  var n=steps.length; if(!n)return '';
  var rowH=26,padT=10,padB=6,labW=150,W=560, plotW=W-labW-60;
  var H=padT+padB+n*rowH, maxT=Math.max.apply(null,steps.map(function(s){return s.time;}))||1;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMin meet">';
  for(var i=0;i<n;i++){ var s=steps[i],y=padT+i*rowH,cy=y+rowH/2,isBn=(i===bnIdx),rt=stepBest(s);
    var wCur=(s.time/maxT)*plotW, wOpt=(rt/maxT)*plotW;
    svg+='<text x="0" y="'+(cy+3.5)+'" font-size="10.5" fill="#3a5160">'+esc(clampStr((i+1)+'. '+s.name,24))+'</text>';
    svg+='<rect x="'+labW+'" y="'+(cy-7)+'" width="'+wCur.toFixed(1)+'" height="14" rx="3" fill="#ddd9d0"><title>'+esc(s.name)+' — '+fmtMin(s.time)+' min</title></rect>';
    svg+='<rect x="'+labW+'" y="'+(cy-7)+'" width="'+wOpt.toFixed(1)+'" height="14" rx="3" fill="'+(isBn?'#b1542f':'#a8854c')+'"><title>after help '+fmtMin(rt)+' min</title></rect>';
    var lbl=(rt<s.time-0.01)?fmtMin(rt)+' / '+fmtMin(s.time):fmtMin(s.time);
    svg+='<text x="'+(labW+Math.max(wCur,wOpt)+6)+'" y="'+(cy+3.5)+'" font-size="10" fill="#5d7280" font-weight="600">'+lbl+'</text>';
  }
  return svg+'</svg>';
}

/* ============================================================
   RENDER — TABS
   ============================================================ */
function setTab(name){
  S.tab=name;
  ['skus','analysis','compare','balance','layout','sim'].forEach(function(t){ $('tab-'+t).classList.toggle('hide',t!==name); });
  Array.prototype.forEach.call($('tabs').children,function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===name); });
  try{
    if(name==='skus') renderSkus();
    if(name==='analysis') renderAnalysis();
    if(name==='compare') renderCompare();
    if(name==='balance') renderBalance();
    if(name==='layout') renderLayout();
    if(name==='sim') renderSim();
  }catch(err){
    console.error(err);
    $('tab-'+name).appendChild(el('div',{class:'err'},'Something went wrong drawing this tab: '+esc(err&&err.message||String(err))+'. Try Reset cuts / Auto-balance, or reload.'));
  }
  window.scrollTo(0,0);
}

/* ---------- PRODUCTS TAB ---------- */
function renderSkus(){
  var host=$('tab-skus'); host.innerHTML='';
  if(S.add){ renderImport(); return; }
  if(S.edit){ renderSkuEditor(); return; }
  var ph=headerEl('Products','Your saved standard-work products. Mark which steps can be helped and how many operators can work them at once.');
  var acts=el('div',{style:'display:flex;gap:10px'});
  var bExp=el('button',{class:'btn btn-light'},'Export backup'); bExp.onclick=exportBackup; if(!S.skus.length)bExp.disabled=true;
  var bImp=el('button',{class:'btn btn-light'},'Restore backup'); bImp.onclick=function(){ $('backupInput').click(); };
  acts.appendChild(bExp); acts.appendChild(bImp); ph.appendChild(acts);
  host.appendChild(ph);
  var grid=el('div',{class:'sku-grid'});
  S.skus.forEach(function(sku){
    var c=el('div',{class:'sku-card'});
    var helpCount=sku.steps.filter(function(s){return s.helpable;}).length;
    c.innerHTML='<div class="nm">'+esc(sku.name)+'</div>'+
      '<div class="meta">'+esc(sku.source||'')+'</div>'+
      '<div class="stat"><div><div class="v">'+fmtMin(skuTotal(sku))+'</div><div class="l">min total</div></div>'+
      '<div><div class="v">'+sku.steps.length+'</div><div class="l">steps</div></div>'+
      '<div><div class="v">'+helpCount+'</div><div class="l">helpable</div></div></div>';
    var row=el('div',{class:'row'});
    var bEdit=el('button',{class:'btn btn-light btn-sm'},'Edit steps');
    bEdit.onclick=function(){ S.edit=sku.id; renderSkus(); };
    var bAna=el('button',{class:'btn btn-light btn-sm'},'Analyze');
    bAna.onclick=function(){ S.anaId=sku.id; setTab('analysis'); };
    var bDel=el('button',{class:'btn btn-danger btn-sm'},'Delete');
    bDel.onclick=function(){ if(confirm('Delete "'+sku.name+'"?')){ S.skus=S.skus.filter(function(x){return x.id!==sku.id;}); saveSkus(); renderSkus(); } };
    row.appendChild(bEdit); row.appendChild(bAna); row.appendChild(bDel);
    c.appendChild(row); grid.appendChild(c);
  });
  var add=el('div',{class:'add-card'},'<span><span class="plus">+</span>Add product<br><span style="font-weight:400;font-size:12px;color:var(--muted)">upload a Standard Work .xlsx</span></span>');
  add.onclick=function(){ $('fileInput').click(); };
  grid.appendChild(add);
  host.appendChild(grid);
  if(!S.skus.length){
    var emp=el('div',{class:'info'},'No products yet. Click <strong>Add product</strong> and drop in a Standard Work Excel file — the app finds your step and time columns automatically, then you choose which steps can be split across operators.');
    host.insertBefore(emp, grid);
  }
}
function headerEl(title,sub){ var h=el('div',{class:'page-h'}); h.innerHTML='<div><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></div>'; return h; }

/* ---------- backup / restore ---------- */
function exportBackup(){
  var data={ app:'TUUCI Standard Work Analyzer', version:2, exportedAt:new Date().toISOString(), skus:S.skus, bal:S.bal };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='tuuci-analyzer-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function importBackup(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var skus = Array.isArray(data)?data:data.skus;
      if(!skus || !Array.isArray(skus) || !skus.length) throw new Error('no products found in that file');
      if(!confirm('Restore '+skus.length+' product(s)? This replaces the products currently in this browser.')) return;
      S.skus=skus; S.bal=(data && data.bal) || {}; saveSkus(); saveBal();
      S.add=null; S.edit=null; S.anaId=null; S.cmpA=null; S.cmpB=null; S.simId=null; S.balId=null;
      setTab('skus');

/* ---------- LINE BALANCE TAB (yamazumi vs takt) ----------
   Works on a derived list of PARTS (a step can be CUT into several parts,
   each independently assignable). part = {step, frac}. */
var BAL_COLORS=['#15171a','#a8854c','#4f7a5b','#3c4a52','#8a6b39','#6b7178','#b1542f','#c9a55f','#2f6b5a','#7a5230'];
var curBalSku=null, curBalC=null, balDrag=null, balCutting=null, _pid=1;
function nextPartId(){ return _pid++; }
function getBal(sku){
  var c=S.bal[sku.id];
  if(!c){ c={ demand:10, hours:7, stations:Math.min(4,sku.steps.length), parts:null, assign:null, people:null }; S.bal[sku.id]=c; }
  if(c.stations<1)c.stations=1; if(c.stations>16)c.stations=16;
  var ok = c.parts && c.parts.length && c.parts.every(function(p){return p.step>=0 && p.step<sku.steps.length;}) && c.assign && c.assign.length===c.parts.length;
  if(!ok){ resetParts(sku,c); autoBalance(sku,c); }
  c.parts.forEach(function(p){ if(p.id==null)p.id=nextPartId(); });
  c.assign=c.assign.map(function(a){ return Math.max(0,Math.min(a,c.stations-1)); });
  if(!c.people || c.people.length!==c.stations){ var p=[]; for(var i=0;i<c.stations;i++)p.push((c.people&&c.people[i])||1); c.people=p; }
  return c;
}
function resetParts(sku,c){ c.parts=sku.steps.map(function(_,i){return {step:i,frac:1,id:nextPartId()};}); c.assign=c.parts.map(function(){return 0;}); }
function partTime(sku,p){ return sku.steps[p.step].time*p.frac; }
function autoBalance(sku,c){
  if(!c.parts||!c.parts.length) resetParts(sku,c);
  var w=c.parts.map(function(p){return partTime(sku,p);});
  var K=Math.max(1,c.stations);
  var groups=partition(w,Math.min(K,w.length));
  var assign=new Array(w.length).fill(0);
  groups.forEach(function(g,gi){ g.forEach(function(idx){ assign[idx]=gi; }); });
  c.assign=assign;
  var pe=[]; for(var i=0;i<K;i++)pe.push((c.people&&c.people[i])||1); c.people=pe; c.stations=K;
}
/* split `minutes` off part pi; remainder stays, new part lands in same station */
function cutPartBy(sku,c,pi,minutes){
  var p=c.parts[pi], stepT=sku.steps[p.step].time, total=partTime(sku,p);
  var m=Math.max(0.1,Math.min(total-0.1,minutes)), fOff=m/stepT;
  p.frac=p.frac-fOff;
  c.parts.splice(pi+1,0,{step:p.step,frac:fOff,id:nextPartId()});
  c.assign.splice(pi+1,0,c.assign[pi]);
  balCutting=null; saveBal(); renderBalance();
}
function cutPart(sku,c,pi){ var p=c.parts[pi]; var nf=p.frac/2; p.frac=nf; c.parts.splice(pi+1,0,{step:p.step,frac:nf}); c.assign.splice(pi+1,0,c.assign[pi]); saveBal(); renderBalance(); }
/* the step's own SWI number if captured on import, else its position */
function stepNumber(sku,idx){ var n=sku.steps[idx].num; return (n!=null)?n:(idx+1); }
/* labels: step number, with a/b/c suffix when a step is cut */
function partLabels(sku,c){

  c.parts.forEach(function(p){ counts[p.step]=(counts[p.step]||0)+1; });
  c.parts.forEach(function(p){ var n=stepNumber(sku,p.step); if(counts[p.step]>1){ seen[p.step]=(seen[p.step]||0)+1; out.push(n+String.fromCharCode(96+seen[p.step])); } else out.push(String(n)); });

function balMetrics(sku,c){
  var raw=[]; for(var s=0;s<c.stations;s++)raw.push(0);
  c.parts.forEach(function(p,i){ raw[Math.min(c.assign[i],c.stations-1)]+=partTime(sku,p); });
  var loads=raw.map(function(r,k){return r/Math.max(1,c.people[k]);});

function startBalDrag(ev, partIdx, chip){

/* ---------- LAYOUT / FLOOR-PLAN TAB ----------
   Each Line-Balance station becomes a draggable box; a Cart/Supply source and

var layEls={};
function layNodes(sku,c){
  var labels=partLabels(sku,c);
  var nodes=[{id:'src',kind:'src',title:'Cart / Supply',people:null,body:'Painted parts staged'}];
  for(var s=0;s<c.stations;s++){
    var steps=[]; c.parts.forEach(function(p,i){ if(Math.min(c.assign[i],c.stations-1)===s) steps.push(labels[i]); });
    nodes.push({id:'s'+s,kind:'st',title:'S'+(s+1),people:c.people[s],body:'Steps '+steps.join(', ')});
  }
  nodes.push({id:'sink',kind:'sink',title:'Finished Goods',people:null,body:'Packed unit'});
  return nodes;
}
function getLayout(sku,c,nodes){
  var L=S.layout[sku.id];
  var ids=nodes.map(function(n){return n.id;});
  if(!L || !L.pos){ L={pos:{},conn:{}}; S.layout[sku.id]=L; }
  // default positions: src top-left, stations in a grid, sink bottom
  var need=ids.some(function(id){return !L.pos[id];});
  if(need){
    L.pos.src={x:40,y:40};
    for(var s=0;s<nodes.length-2;s++){ var col=s%4, row=Math.floor(s/4); L.pos['s'+s]={x:40+col*210, y:200+row*150}; }
    var lastRow=Math.floor((nodes.length-3)/4);
    L.pos.sink={x:40, y:200+(lastRow+1)*150+20};
  }
  // default connections: linear src->s0->...->sink
  if(!L.conn || !Object.keys(L.conn).length){
    L.conn={}; var st=ids.filter(function(i){return i!=='src'&&i!=='sink';});
    L.conn.src= st.length?[st[0]]:['sink'];
    for(var k=0;k<st.length;k++){ L.conn[st[k]]=[ k<st.length-1?st[k+1]:'sink' ]; }
  }
  // prune stale ids
  Object.keys(L.pos).forEach(function(id){ if(ids.indexOf(id)<0) delete L.pos[id]; });
  Object.keys(L.conn).forEach(function(id){ if(ids.indexOf(id)<0) delete L.conn[id]; else L.conn[id]=L.conn[id].filter(function(t){return ids.indexOf(t)>=0;}); });
  return L;
}
function connToText(arr){ return (arr||[]).map(function(id){ return id==='sink'?'FG':(id==='src'?'Cart':'S'+(parseInt(id.slice(1),10)+1)); }).join(', '); }
function textToConn(txt,ids){
  var out=[]; (txt||'').split(/[,\s]+/).forEach(function(tok){ tok=tok.trim().toUpperCase(); if(!tok)return;
    if(tok==='FG'||tok==='OUT'||tok==='FINISHED'){ if(ids.indexOf('sink')>=0)out.push('sink'); return; }
    var m=tok.match(/S?(\d+)/); if(m){ var id='s'+(parseInt(m[1],10)-1); if(ids.indexOf(id)>=0)out.push(id); }
  });
  return out;
}

function drawLayArrows(L,svg){

  var card=el('div',{class:'card'});
  card.innerHTML='<div class="ch"><h2>Idle time per operator</h2><span class="hint">bar width = total build time ('+fmtMin(res.makespan)+' min)</span></div>';
  var cb=el('div',{class:'cb'});
  res.ops.forEach(function(o){
    var row=el('div',{class:'opbar-row'});
    var wPct=res.makespan>0?o.work/res.makespan*100:0, mPct=res.makespan>0?o.move/res.makespan*100:0;
    row.innerHTML='<div class="lab" title="'+esc(o.role||'')+'">'+esc(o.name)+'</div>'+
      '<div class="opbar"><div class="seg work" style="width:'+wPct.toFixed(1)+'%" title="working '+fmtMin(o.work)+' min"></div><div class="seg move" style="width:'+mPct.toFixed(1)+'%" title="moving '+fmtMin(o.move)+' min"></div></div>'+
      '<div class="pct">'+fmt(o.idle/60,1)+'h idle</div>';
    cb.appendChild(row);
  });
  cb.appendChild(el('div',{class:'legend'},'<span><i style="background:var(--aqua)"></i>Working</span><span><i style="background:var(--bronze)"></i>Moving (buffer)</span><span><i style="background:#f0f4f5;border:1px solid #e7eef0"></i>Idle</span>'));
  card.appendChild(cb); host.appendChild(card);
  // explanation
  var note = cfg.mode==='station'
    ? 'Operators are pinned to balanced stations; units flow down the line and one finishes every <strong>'+fmtMin(res.cycle)+' min</strong> (the cycle time). '+(res.used<cfg.ops?('Only '+res.used+' of '+cfg.ops+' operators are needed for '+res.used+' stations — the rest sit idle. '):'')+'The move buffer is added once per unit at each station for material handling.'
    : 'Operators float to whatever is ready; idle operators pile onto <strong>helpable</strong> steps (up to each step’s max operators) to finish them faster. Each task carries a <strong>'+fmtMin(cfg.buffer)+' min</strong> move buffer for fetching parts and walking over.';
  host.appendChild(el('div',{class:'info',style:'margin-top:18px'},note));
  host.appendChild(el('div',{class:'footer'},'TUUCI · Standard Work Analyzer — runs entirely in your browser. Nothing is uploaded.'));
}

Array.prototype.forEach.call($('tabs').children,function(b){ b.onclick=function(){ setTab(b.getAttribute('data-tab')); }; });
$('fileInput').onchange=function(){ if(this.files&&this.files[0]) handleFile(this.files[0]); this.value=''; };
$('backupInput').onchange=function(){ if(this.files&&this.files[0]) importBackup(this.files[0]); this.value=''; };
// global drag-drop onto Products
window.addEventListener('dragover',function(e){ if(S.tab==='skus'){ e.preventDefault(); } });
window.addEventListener('drop',function(e){ if(S.tab==='skus' && !S.edit){ e.preventDefault(); var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f); } });
setTab('skus');
</script>
